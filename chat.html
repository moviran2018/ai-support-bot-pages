<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار پشتیبانی هوشمند</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px;
    }
    #chat-container {
      width: 100%; max-width: 720px; height: 92vh; max-height: 860px;
      border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      display: flex; flex-direction: column; overflow: hidden;
      background: #fff;
    }
    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 18px 24px; font-weight: bold; font-size: 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .chat-header .dot {
      width: 10px; height: 10px; border-radius: 50%; background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34,197,94,0.25);
    }
    .client-badge {
      font-size: 11px; background: rgba(255,255,255,0.2);
      padding: 3px 10px; border-radius: 12px; margin-right: auto;
    }
    .chat-messages { flex: 1; overflow-y: auto; padding: 24px; background: #f8f9fa; }
    .message {
      margin-bottom: 14px; max-width: 80%; padding: 12px 16px;
      border-radius: 14px; font-size: 14.5px; line-height: 1.8;
      word-wrap: break-word; white-space: pre-wrap;
    }
    .message.user {
      margin-right: auto; background: #667eea; color: white;
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      margin-left: auto; background: #e9ecef; color: #333;
      border-bottom-left-radius: 4px;
    }
    .message.typing { color: #888; font-style: italic; }
    .chat-input { display: flex; padding: 16px; border-top: 1px solid #e9ecef; background: #fff; }
    .chat-input input {
      flex: 1; border: 1px solid #dee2e6; border-radius: 24px;
      padding: 12px 18px; font-size: 14.5px; outline: none; font-family: inherit;
    }
    .chat-input button {
      margin-right: 10px; padding: 12px 24px; border: none;
      border-radius: 24px; background: #667eea; color: white;
      cursor: pointer; font-weight: bold; font-family: inherit; font-size: 14px;
    }
    .chat-input button:hover { background: #5a6fd6; }
    .chat-input button:disabled { background: #ccc; cursor: not-allowed; }

    @media (max-width: 640px) {
      body { padding: 0; }
      #chat-container { height: 100vh; max-height: 100vh; border-radius: 0; }
      .message { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div id="chat-container">
    <div class="chat-header">
      <span class="dot"></span>🤖 دستیار پشتیبانی هوشمند
    </div>
    <div class="chat-messages" id="messages"></div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="سوال خود را بنویسید..." autocomplete="off" />
      <button id="sendBtn" onclick="sendMessage()">ارسال</button>
    </div>
  </div>

  <script src="./config.js"></script>
  <script>
    const CLIENT_ID = window.getClientId();
    const CHAT_URL = window.apiUrl('/api/chat');
    const sessionId = localStorage.getItem(`chatSession_${CLIENT_ID}`) || crypto.randomUUID();
    localStorage.setItem(`chatSession_${CLIENT_ID}`, sessionId);

    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message || sendBtn.disabled) return;

      addMessage(message, 'user');
      input.value = '';
      sendBtn.disabled = true;

      const typing = document.createElement('div');
      typing.className = 'message bot typing';
      typing.textContent = 'در حال تایپ...';
      messagesDiv.appendChild(typing);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      try {
        const res = await fetch(CHAT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, sessionId }),
        });
        const data = await res.json();
        typing.remove();
        if (data.error) {
          addMessage('⚠️ ' + data.error, 'bot');
          return;
        }
        addMessage(data.reply, 'bot');
      } catch (e) {
        typing.remove();
        addMessage('خطا در ارتباط. لطفاً دوباره تلاش کنید.', 'bot');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    input.focus();
  </script>
</body>
</html>
